<div class="row">
  <div class="col-md-3">
    <span class="hipster img-fluid rounded"></span>
  </div>

  <div class="col-md-9">
    <h1 class="display-4"><span jhiTranslate="home.title">Welcome message</span></h1>

    <div>
      @if (account(); as accountRef) {
        <div class="alert alert-success">
          <span id="home-logged-message" jhiTranslate="home.logged.message" [translateValues]="{ username: accountRef.login }"
            >Está conectado como &quot;{{ accountRef.login }}&quot;.</span
          >
        </div>
        <div class="row g-3 mt-2">
          <div class="col">
            <a
              class="btn btn-secondary btn-lg w-100 py-4"
              style="font-size: 4rem"
              routerLink="/articulo/recetas"
              jhiTranslate="home.actions.recipes"
            >
              Recetas
            </a>
          </div>
          <div class="col">
            <a
              class="btn btn-primary btn-lg w-100 py-4"
              style="font-size: 3rem"
              routerLink="/articulo/new"
              jhiTranslate="home.actions.createRecipe"
            >
              Crear receta
            </a>
          </div>
          <div class="col">
            <a
              class="btn btn-success btn-lg w-100 py-4"
              style="font-size: 3rem"
              routerLink="/articulo/new/ingrediente"
              jhiTranslate="home.actions.createIngredient"
            >
              Crear ingrediente
            </a>
          </div>
        </div>
      } @else {
        <div class="alert alert-warning">
          <a class="alert-link" (click)="login()" jhiTranslate="global.messages.info.authenticated.link">iniciar sesión</a>
        </div>
      }
    </div>
  </div>
</div>
