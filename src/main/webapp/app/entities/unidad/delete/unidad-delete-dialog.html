@if (unidad) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(unidad.id)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="unidadDeleteDialogHeading">
        <jhi-entity-icon />&nbsp;<span jhiTranslate="entity.delete.title">Confirmar operación de borrado</span>
      </h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      <p id="jhi-delete-unidad-heading" jhiTranslate="ctrlProdNewApp.unidad.delete.question" [translateValues]="{ desc: unidad.descUni }">
        ¿Seguro que quiere eliminar Unidad {{ unidad.descUni }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Cancelar</span>
      </button>

      <button id="jhi-confirm-delete-unidad" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span jhiTranslate="entity.action.delete">Eliminar</span>
      </button>
    </div>
  </form>
}
