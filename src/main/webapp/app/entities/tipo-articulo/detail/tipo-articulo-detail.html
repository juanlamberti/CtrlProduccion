<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (tipoArticulo(); as tipoArticuloRef) {
      <div>
        <h2 data-cy="tipoArticuloDetailsHeading">
          <jhi-entity-icon />&nbsp;<span jhiTranslate="ctrlProdNewApp.tipoArticulo.detail.title">Tipo Articulo</span>
        </h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="ctrlProdNewApp.tipoArticulo.descTpArt">Desc Tp Art</span></dt>
          <dd>
            <span>{{ tipoArticuloRef.descTpArt }}</span>
          </dd>
        </dl>

        <button type="button" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Volver</span>
        </button>

        <button type="button" [routerLink]="['/tipo-articulo', tipoArticuloRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editar</span>
        </button>
      </div>
    }
  </div>
</div>
